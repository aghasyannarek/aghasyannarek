name: Refresh profile cards

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/render_cards.py
      - assets/fonts/**
      - requirements.txt
      - .github/workflows/refresh-cards.yml
  pull_request:
    paths:
      - profile.json
      - scripts/**
      - tests/**
      - assets/fonts/**
      - requirements.txt
      - .github/workflows/refresh-cards.yml

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install font subsetting tools
        run: python -m pip install -r requirements.txt
      - name: Check contribution calculations and SVG contract
        run: python -m unittest discover -s tests -v
      - name: Refresh contribution JSON and public pinned projects
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_cards.py --refresh
      - name: Render animated cards and README
        run: python scripts/render_cards.py
      - name: Commit refreshed JSON and cards
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json cards/ README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile cards [skip ci]'
            git push
          fi
