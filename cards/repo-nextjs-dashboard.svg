<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="188" viewBox="0 0 960 188" role="img" aria-labelledby="title desc">
<title id="title">aghasyannarek/nextjs-dashboard</title>
<desc id="desc">A Next.js dashboard with TypeScript and Tailwind CSS.</desc>
<style>
@font-face{font-family:Space;src:url(data:font/woff;base64,) format('woff');font-weight:300 700;font-style:normal}
@font-face{font-family:Plex;src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}
:root{color:#c9d1d9}
text{font-family:Space,sans-serif;fill:#c9d1d9;font-weight:400}
.mono{font-family:Plex,monospace;font-weight:400}
.bold{font-weight:700;letter-spacing:-1.8px}
.muted{fill:#8b949e}
.accent{fill:#58a6ff;color:#58a6ff}
.ink{fill:#0d1117}
.surface{fill:#161b22}
.line{stroke:#30363d;fill:none}
@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cell{from{opacity:.12}to{opacity:1}}
.reveal{animation:arrive .6s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.day{animation:cell .55s ease both}
.smil-trace{stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .reveal,.day{opacity:1!important;transform:none!important}
 .bar{transform:none!important}
 /* CSS overrides the SMIL presentation value, fixing the trace at its final frame. */
 .smil-trace{stroke-dashoffset:0!important}
}
</style>
<rect x="0.5" y="0.5" width="959" height="187" rx="22" fill="#0d1117" stroke="#30363d"/><g class="reveal " style="animation-delay:2.05s"><text x="36" y="34" font-size="11" class="mono muted" letter-spacing="1.5">FEATURED PROJECT 01</text><text x="886" y="34" font-size="11" class="mono accent" text-anchor="end">03 / SOURCE</text><text x="36" y="82" font-size="30" class="bold" >nextjs-dashboard</text><text x="36" y="113" font-size="16" class="muted" >A Next.js dashboard with TypeScript and Tailwind CSS.</text><text x="36" y="151" font-size="11" class="mono accent" >Next.js / TypeScript / Tailwind CSS</text><text x="710" y="151" font-size="10" class="mono muted" text-anchor="end">0 STARS</text><g transform="translate(772 48)"><rect x="0" y="0" width="132" height="116" rx="16" fill="#161b22"/><rect x="18" y="20" width="24" height="76" rx="4" fill="#58a6ff" opacity="0.25"/><rect x="50" y="20" width="64" height="20" rx="4" fill="#58a6ff" opacity="0.8"/><rect x="50" y="48" width="28" height="48" rx="4" fill="#58a6ff" opacity="0.4"/><rect x="86" y="48" width="28" height="48" rx="4" fill="#58a6ff" opacity="0.2"/></g><g class="accent"><path d="M909 37l13 -13m-13 0h13v13" fill="none" stroke="currentColor" stroke-width="1.7"/></g></g>
</svg>
