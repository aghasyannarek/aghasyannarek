<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Narek Aghasyan</title>
<desc id="desc">Frontend developer from Armenia. Building interfaces with React &amp; TypeScript.</desc>
<style>
@font-face{font-family:Space;src:url(data:font/woff;base64,) format('woff');font-weight:300 700;font-style:normal}
@font-face{font-family:Plex;src:url(data:font/woff;base64,) format('woff');font-weight:400;font-style:normal}
:root{color:#f1f4e9}
text{font-family:Space,sans-serif;fill:#f1f4e9;font-weight:400}
.mono{font-family:Plex,monospace;font-weight:400}
.bold{font-weight:700;letter-spacing:-1.8px}
.muted{fill:#a0afa6}
.accent{fill:#d2f86a;color:#d2f86a}
.ink{fill:#101716}
.surface{fill:#18211f}
.line{stroke:#2b3933;fill:none}
@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cell{from{opacity:.12}to{opacity:1}}
.reveal{animation:arrive .6s cubic-bezier(.2,.7,.2,1) both}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.day{animation:cell .55s ease both}
.smil-trace{stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
 .reveal,.day{opacity:1!important;transform:none!important}
 .bar{transform:none!important}
 /* CSS overrides the SMIL presentation value, fixing the trace at its final frame. */
 .smil-trace{stroke-dashoffset:0!important}
}
</style>
